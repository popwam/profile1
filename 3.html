<style>

    padding: clamp(18px, 3vw, 42px);

  .eyebrow {
    letter-spacing: .34em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 700;
    color: #5a657a;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(54px, 6vw, 82px);
    line-height: .96;
    letter-spacing: -.035em;
  }

  .role {
    margin: 14px 0 14px;
    font-size: 24px;
    color: #3e4b63;
  }

  .accent-line {
    width: 52px;
    height: 3px;
    border-radius: 999px;
    background: var(--accent);
    margin: 12px 0 20px;
  }

  .bio {
    max-width: 440px;
    font-size: 19px;
    line-height: 1.45;
    color: #4e5b72;
    margin: 0 0 22px;
  }

  .facts {
    display: grid;
    gap: 14px;
    margin: 0 0 32px;
  }

  .fact {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    color: #41506a;
  }

  .fact svg {
    width: 23px;
    height: 23px;
    stroke: #0a1a34;
    flex: 0 0 auto;
  }

  .actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }

  .btn {
    min-height: 56px;
    padding: 0 28px;
    border-radius: 18px;
    text-decoration: none;
    font-weight: 800;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    transition: .2s ease;
  }

  .btn-primary {
    color: #fff;
    background: linear-gradient(180deg,#0f2d42,#081d2e);
    box-shadow: 0 10px 25px rgba(8,29,46,.18);
  }

  .btn-secondary {
    color: #0a1a34;
    border: 1.5px solid #0a1a34;
    background: rgba(255,255,255,.45);
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  .visual {
    justify-self: center;
    width: min(100%, 430px);
  }

  .portrait-wrap {
    width: 100%;
    aspect-ratio: .74;
    max-height: 540px;
    border-radius: 28px;
    overflow: hidden;
    background: #cfd5dc;
    box-shadow: 0 24px 60px rgba(27,42,62,.16);
    border: 1px solid rgba(255,255,255,.9);
  }

  .portrait-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 48% 50%;
    display: block;
  }

  .scribble {
    position: absolute;
    right: 28px;
    bottom: 62px;
    font-family: "Segoe Script", "Bradley Hand", cursive;
    font-size: 33px;
    line-height: 1.08;
    color: white;
    transform: rotate(-7deg);
    text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
    pointer-events: none;
  }

  .side-note {
    position: absolute;
    right: 24px;
    top: 36px;
    font-family: "Segoe Script", "Bradley Hand", cursive;
    font-size: 24px;
    line-height: 1.1;
    color: #2e3b54;
    transform: rotate(-8deg);
    text-align: center;
    z-index: 2;
  }

  .socials {
    position: absolute;
    left: clamp(38px, 5vw, 68px);
    bottom: 42px;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .social {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    color: #fff;
    display: grid;
    place-items: center;
    text-decoration: none;
    font-weight: 900;
    font-size: 26px;
    box-shadow: 0 10px 18px rgba(36,52,74,.12);
    transition: .2s ease;
  }
  .social:hover { transform: translateY(-3px) scale(1.03); }
  .fb { background:#1877f2; }
  .wa { background:#25d366; }
  .ig { background:radial-gradient(circle at 35% 110%,#ffdc80 0 14%,#fcaf45 25%,#f77737 39%,#f56040 45%,#fd1d1d 53%,#e1306c 68%,#c13584 76%,#833ab4 88%,#405de6 100%); }
  .in { background:#0a66c2; }
  .web { background:#697180; }

  .social small {
    font-size: 17px;
    font-weight: 800;
  }

  @media (max-width: 820px) {
    body { padding: 12px; align-items: start; }
    .page {
      padding: 10px;
      border-radius: 24px;
      max-width: 460px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      min-height: auto;
      padding: 14px 14px 22px;
      gap: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.95);
    }

    .visual {
      width: 100%;
      order: 0;
    }

    .portrait-wrap {
      aspect-ratio: 1.45;
      max-height: none;
      border-radius: 20px;
    }

    .portrait-wrap img {
      object-position: 50% 33%;
    }

    .scribble,
    .side-note {
      display: none;
    }

    .copy {
      order: 1;
      width: 100%;
    }

    .eyebrow {
      display: none;
    }

    h1 {
      font-size: clamp(42px, 13vw, 58px);
      line-height: .98;
    }

    .role {
      font-size: 18px;
      margin: 8px 0 8px;
    }

    .accent-line {
      width: 42px;
      margin: 10px 0 14px;
    }

    .bio {
      font-size: 16px;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .facts {
      gap: 11px;
      margin-bottom: 20px;
    }

    .fact {
      font-size: 15px;
      gap: 11px;
    }

    .fact svg {
      width: 20px;
      height: 20px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      margin: 0;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 50px;
      border-radius: 17px;
      padding: 0 18px;
    }

    .socials {
      position: static;
      order: 2;
      width: 100%;
      padding-top: 4px;
      justify-content: space-between;
      gap: 9px;
    }

    .social {
      width: 46px;
      height: 46px;
      font-size: 24px;
    }
  }

  @media (max-width: 380px) {
    .hero { padding-inline: 11px; }
    .social { width: 42px; height: 42px; }
  }
</style>
</head>
